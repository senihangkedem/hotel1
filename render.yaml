services:
  - type: web
    name: restaurant-saas-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    autoDeployTrigger: off
    healthCheckPath: /ready/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: restaurant-saas-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: FRONTEND_HOSTNAME
        sync: false
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: restaurant-saas-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: restaurant-saas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: restaurant-saas-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: restaurant-saas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: restaurant-saas-db
          property: port
      - key: DB_SSLMODE
        value: require
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: restaurant-saas-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: TRUST_PROXY_SSL_HEADER
        value: "1"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: API_NUM_PROXIES
        value: "0"

  - type: keyvalue
    name: restaurant-saas-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    runtime: static
    name: restaurant-saas-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_BASE_URL
        sync: false

databases:
  - name: restaurant-saas-db
    plan: free
    region: oregon
    ipAllowList: []